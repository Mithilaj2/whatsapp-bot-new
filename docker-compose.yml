# Local development database. Start with: docker compose up -d
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: webrand
      POSTGRES_PASSWORD: webrand
      POSTGRES_DB: webrand360
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Used from Phase 3 for the message sending queue
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  pgdata:
